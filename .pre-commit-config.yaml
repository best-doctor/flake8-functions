repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
        exclude: ^tests/test_files/
      - id: end-of-file-fixer
        exclude: ^tests/test_files/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^tests/test_files/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.4
    hooks:
      - id: uv-lock

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Fixture files are intentionally badly written; flake8's own `exclude`
        # does not apply to paths pre-commit passes explicitly.
        exclude: ^tests/test_files/
        additional_dependencies:
          - flake8-pyproject>=1.2.4
          - flake8-2020>=1.8.1
          - flake8-annotations-complexity>=0.2
          - flake8-annotations-coverage>=0.0.6
          - flake8-blind-except>=0.2.1
          - flake8-broken-line>=1.0
          - flake8-bugbear>=24.12
          - flake8-builtins>=2.5
          - flake8-class-attributes-order>=0.3
          - flake8-comprehensions>=3.16
          - flake8-debugger>=4.1.2
          - flake8-docstrings>=1.7
          - flake8-eradicate>=1.5
          - flake8-fixme>=1.1.1
          - flake8-print>=5.0
          - flake8-quotes>=3.4
          - flake8-string-format>=0.4
          - flake8-tidy-imports>=4.11
          - flake8-typing-imports>=1.16
          - flake8-variables-names>=0.0.6
          - dlint>=0.16

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        exclude: ^(tests/|build/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
